<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 36px;
            border: 1px solid #d8dee8;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
        }

        .field {
            display: block;
            margin-bottom: 18px;
            font-weight: 600;
        }

        input {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            border-color: #2563eb;
            outline: 3px solid #bfdbfe;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 22px;
            color: #475569;
            font-size: 14px;
        }

        .remember input {
            width: auto;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #b91c1c;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to view the sales report.</p>

        <form id="login-form">
            <label class="field" for="email">
                Email address
                <input type="email" id="pwfiles98@gmail.com" name="email" autocomplete="email" required>
            </label>

            <label class="field" for="password">
                Password
                <input type="password" id="0010" name="password" autocomplete="current-password" required>
            </label>

            <label class="remember">
                <input type="checkbox" name="remember">
                Remember me
            </label>

            <button type="submit">Log in</button>
            <p class="message" id="message" role="alert"></p>
        </form>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const message = document.getElementById('message');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!loginForm.checkValidity()) {
                message.textContent = 'Please enter a valid email and password.';
                loginForm.reportValidity();
                return;
            }

            window.location.href = 'tabletest.html';
        });
    </script>
</body>
</html>
