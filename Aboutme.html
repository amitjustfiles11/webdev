<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p
        {
            color: rgb(235, 232, 232);
        }
        img
        {
            width: 100vw;
            height: 100vh;
        }
        p.top
        {
            position: fixed;
            top: 0%;
        }
        p.mid
        {
            position: fixed;
            top: 50%;
        }
        p.bottom
        {
            position: fixed;
            bottom: 0;
        }
        *{
            margin: 0;
            padding: 0;
        }
        #centre{
            text-align: center;        }
        #right{
            text-align: right;
        }
        p
        {
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="photograph.jpeg" alt="My Photo">
    <p class="top" id="centre">Amit</p>
    <p class="top">Amit</p>
    <p class="top" id="right">Amit</p>
    <p class="mid" id="centre">Amit</p>
    <p class="mid">Amit</p>
    <p class="mid" id="right">Amit</p>
    <p class="bottom" id="left">Amit </p>
    <p class="bottom"id="centre"> Amit </p>
    <p class="bottom" id="right" >Amit  </p>
</body>
</html>
