<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Photo Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
             width: 100vw;
             height: 100dvh; /* Fixes Chrome height bug */
             overflow: hidden;
             background-color: #222; 
             font-family: Arial, sans-serif;
            
        
             display: flex;
             justify-content: center;
             align-items: center;
        }

  
        .photo-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    
        .background {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
            filter: blur(2px);
        }

       
        .name-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 15px; 
            pointer-events: none;
        }

      
        .name-grid div {
            display: flex;
            width: 100%;
            height: 100%;
        }

       
        .name-grid div span {
            font-size: 20px; 
            font-weight: bold;
            color: #000000; 
        }

       
        .left   { justify-content: flex-start; }
        .center { justify-content: center; }
        .right  { justify-content: flex-end; }  


        .top    { align-items: flex-start; }
        .middle { align-items: center; }
        .bottom { align-items: flex-end; }     
    </style>
</head>
<body>

    <div class="photo-frame">
      
        <img class="background" src="photograph.jpeg" alt="Background Picture">

       
        <div class="name-grid">
           
            <div class="top left"><span>Amit<span></div>
            <div class="top center"><span>Amit</span></div>
            <div class="top right"><span>Amit</span></div>
            
          
            <div class="middle left"><span>Amit</span></div>
            <div class="middle center"><span>Amit</span></div>
            <div class="middle right"><span>Amit</span><Amit     
         
            <div class="bottom left"><span>AMIT</span></div>
            <div class="bottom center"><span>AMIT</span></div>
            <div class="bottom right"><span> AMIT</span></div>
        </div>
    </div>

</body>
</html>
